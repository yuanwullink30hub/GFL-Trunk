# Security gates that fail the build.
#
#   audit            `pnpm audit --prod --audit-level high`: a High or Critical advisory on a production
#                    dependency fails. Runs on every push and pull request, and weekly — new advisories
#                    are published against code that has not changed, so a quiet repo still gets checked.
#   backend-security apps/backend/tests: the regression tests for the hardening brief (rate limits, payment
#                    single-flight, upload isolation, sessions, fail-closed config, the crystal code's key).
#                    Each runs against its own in-memory MongoDB with the real .env switched off; there are no
#                    secrets here and none are needed. Node 22, as on Render.
#
# Moderate advisories do not fail the build. At the time of writing one remains: sprintf-js (via mammoth >
# argparse), for which no fixed version exists.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No High or Critical advisory on a production dependency
        run: corepack pnpm@9.0.0 audit --prod --audit-level high

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: corepack pnpm@9.0.0 install --frozen-lockfile
      - name: Backend security tests
        working-directory: apps/backend
        run: node --test "tests/*.test.js"
