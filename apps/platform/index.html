<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0510">
    <meta name="msapplication-navbutton-color" content="#0a0510">
    <meta name="color-scheme" content="dark">
    <title>Garden For Life - DELTAWERKEN</title>
    <!-- Loading-screen language, decided before the body paints so the overlay never flashes
         the wrong language. Same rule as @gfl/i18n's LanguageProvider (keep in sync): the
         visitor's NL/EN toggle pick if any, else the language of their IP country (data-geo-lang,
         set by functions/_middleware.js), else Dutch for a Dutch browser, else English. -->
    <script>
      (function() {
        var lang = null;
        try { lang = localStorage.getItem('gfl_language_choice'); } catch (e) {}
        if (lang !== 'nl' && lang !== 'en') {
          lang = document.documentElement.getAttribute('data-geo-lang');
        }
        if (lang !== 'nl' && lang !== 'en') {
          var browserLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          lang = browserLang.toLowerCase().split('-')[0] === 'nl' ? 'nl' : 'en';
        }
        document.documentElement.lang = lang;
      })();
    </script>
    <!-- Google Fonts - Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }

        /* Desktop: prevent scroll (map uses transforms) */
        @media (min-width: 768px) {
            html, body, #root {
                overflow: hidden !important;
            }
        }

        /* Mobile: allow vertical scroll */
        @media (max-width: 767px) {
            html, body {
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            #root {
                overflow: visible !important;
                min-height: 100%;
                height: auto;
            }
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0a0510;
            color: #e0e0e0;
        }

        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Loading overlay — rendered BEFORE any JS so it appears instantly -->
    <div id="gfl-loading-overlay" style="
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 99999;
      background-color: rgba(0, 0, 0, 0.98);
      opacity: 1;
      transition: opacity 0.5s ease-out;
    ">
      <div style="
        position: relative;
        background-color: rgba(8, 2, 12, 0.9);
        padding: 2.5rem 3rem;
        min-width: 380px;
        max-width: 500px;
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 0.5rem;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex; flex-direction: column; align-items: center;
      " id="gfl-loading-modal">
        <!-- Corner accents -->
        <div style="position:absolute;top:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:10px 0 0 0;border-bottom:none;border-right:none"></div>
        <div style="position:absolute;top:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 10px 0 0;border-bottom:none;border-left:none"></div>
        <div style="position:absolute;bottom:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 0 10px;border-top:none;border-right:none"></div>
        <div style="position:absolute;bottom:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 10px 0;border-top:none;border-left:none"></div>

        <!-- Content wrapper (counter-rotated on mobile) -->
        <div id="gfl-loading-content" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%">
          <!-- Loading: spinner + slideshow. Shown immediately on a fresh visit. -->
          <div id="gfl-loading-phase2" style="width:100%;display:flex;flex-direction:column;align-items:center">
            <!-- Spinner -->
            <div id="gfl-loading-spinner" class="keep-spinning" style="
              width: 3rem; height: 3rem;
              border: 2px solid #a855f7;
              border-top-color: transparent;
              border-radius: 50%;
              margin: 0 auto 1.5rem;
            "></div>

            <!-- Rotating text slideshow -->
            <div id="gfl-loading-slideshow" style="
              position: relative;
              width: 100%;
              max-width: 380px;
              min-height: 3.6rem;
              overflow: hidden;
            ">
              <p class="gfl-slide keep-spinning" style="animation-delay: 0s"><span class="gfl-nl">Omgeving initialiseren</span><span class="gfl-en">Initializing environment</span></p>
              <p class="gfl-slide keep-spinning" style="animation-delay: 2.8s"><span class="gfl-nl">Exclusieve toegang<br>tot Beta V4.9</span><span class="gfl-en">Exclusive access<br>to Beta V4.9</span></p>
              <p class="gfl-slide keep-spinning" style="animation-delay: 5.6s">Six Seven</p>
            </div>
          </div>
        </div>

        <!-- Noise overlay -->
        <div style="position:absolute;inset:0;pointer-events:none;border-radius:0.5rem;background-image:url('/images/noise.svg');opacity:0.05;mix-blend-mode:overlay"></div>
      </div>
    </div>

    <!-- Loading animations — pure CSS, runs on compositor thread -->
    <style>
      @keyframes gfl-spin { to { transform: rotate(360deg); } }
      #gfl-loading-spinner { animation: gfl-spin 1s linear infinite; }

      /* Bilingual loading copy — <html lang> is set by the head script */
      html[lang="nl"] .gfl-en, html:not([lang="nl"]) .gfl-nl { display: none; }

      /* Text slideshow: 3 cards, 8.4s total cycle, each visible 2.8s */
      @keyframes gfl-slide-cycle {
        0%      { opacity: 0; transform: translateY(6px); }
        3%      { opacity: 1; transform: translateY(0); }
        30%     { opacity: 1; transform: translateY(0); }
        35%     { opacity: 0; transform: translateY(-6px); }
        100%    { opacity: 0; transform: translateY(-6px); }
      }
      .gfl-slide {
        position: absolute;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        letter-spacing: 0.05em;
        color: rgba(255, 254, 240, 0.9);
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        line-height: 1.4;
        opacity: 0;
        animation: gfl-slide-cycle 8.4s ease-in-out infinite;
      }
      /* Post-login Levensles — static (no rotation), wraps a full paragraph. */
      .gfl-lesson-label {
        margin: 0 0 0.9rem;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        font-family: 'Rajdhani', sans-serif;
        font-size: 0.72rem;
        color: #c4b5fd;
      }
      .gfl-lesson-slide {
        margin: 0;
        text-align: center;
        letter-spacing: 0.02em;
        color: rgba(255, 254, 240, 0.9);
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        animation: gfl-fade-in 0.6s ease-out both;
      }
      @keyframes gfl-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 767px) {
        #gfl-loading-modal { padding: 1.5rem 1.25rem !important; min-width: auto !important; width: 85vw !important; max-width: 85vw !important; box-sizing: border-box !important; }
        #gfl-loading-spinner { width: 2.5rem !important; height: 2.5rem !important; }
        .gfl-slide { font-size: 0.9rem !important; word-wrap: break-word !important; overflow-wrap: break-word !important; white-space: normal !important; }
        #gfl-loading-slideshow { min-height: 3.2rem !important; max-width: 100% !important; overflow: hidden !important; }
      }
    </style>

    <!-- Boot overlay: the loading screen paints immediately on a fresh visit. -->
    <script>
      (function() {
        // Fade out & remove the overlay — defined first so all branches can call it
        window.__gflDismissOverlay = function() {
          var overlay = document.getElementById('gfl-loading-overlay');
          if (!overlay) return;
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 500);
        };

        var isMobile = window.innerWidth < 768;
        var appReady = false;

        // The closed-beta access gate is gone. Visitors who used the site back then may
        // still carry its two localStorage items; nothing writes or reads them any more
        // and the privacy policy no longer lists them, so sweep them off the device.
        try {
          localStorage.removeItem('gfl_beta_access');
          localStorage.removeItem('gfl_beta_access_time');
        } catch (e) {}

        // Called by React when preloading + nebula are done
        window.__gflAppReady = function() {
          appReady = true;
          window.__gflDismissOverlay();
        };

        // Post-login boot: the login flow stashes the client's archetype "Levensles" in
        // localStorage before hard-refreshing. If present, show it in the loading slideshow
        // (replacing the generic rotating slides) for this one boot, then clear it.
        (function applyBootLesson() {
          var lesson = null;
          try { lesson = localStorage.getItem('gfl_boot_lesson'); } catch (e) {}
          if (!lesson) return;
          try { localStorage.removeItem('gfl_boot_lesson'); } catch (e) {}
          var ss = document.getElementById('gfl-loading-slideshow');
          if (!ss) return;
          ss.style.minHeight = 'auto';
          ss.style.overflow = 'visible';
          ss.style.maxWidth = '440px';
          var label = document.createElement('p');
          label.className = 'gfl-lesson-label';
          label.textContent = document.documentElement.lang === 'nl' ? 'Levensles' : 'Life lesson';
          var body = document.createElement('p');
          body.className = 'gfl-lesson-slide';
          body.textContent = lesson;           // textContent — safe, no HTML injection
          ss.innerHTML = '';
          ss.appendChild(label);
          ss.appendChild(body);
        })();

        // ── iDEAL bank window returning (?betaling=terug): a result card, then close ──
        // The report tab follows the payment itself (status poll + webhook) and main.jsx mounts no
        // app here, so this window never shows the site loading. Stripe appends redirect_status
        // (succeeded | processing | failed); the card only reflects the bank step, the report tab
        // stays the source of truth. A window opened by script may close itself; when the browser
        // refuses, the card stays and says so.
        if (/[?&]betaling=terug(&|$)/.test(window.location.search)) {
          var returnOverlay = document.getElementById('gfl-loading-overlay');
          if (returnOverlay && returnOverlay.parentNode) returnOverlay.parentNode.removeChild(returnOverlay);
          var redirectStatus = new URLSearchParams(window.location.search).get('redirect_status');
          var en = false;
          try { en = localStorage.getItem('gfl_language_choice') === 'en'; } catch (e) {}
          var result = redirectStatus === 'succeeded'
            ? { color: '#a855f7', rgb: '168, 85, 247', title: en ? 'Payment successful' : 'Betaling gelukt', body: en ? 'Your report is ready in your other tab.' : 'Je rapport staat klaar in je andere tabblad.' }
            : redirectStatus === 'processing'
              ? { color: '#a855f7', rgb: '168, 85, 247', title: en ? 'Payment processing' : 'Betaling wordt verwerkt', body: en ? 'Your other tab updates as soon as the payment is in.' : 'Je andere tabblad werkt zichzelf bij zodra de betaling binnen is.' }
              : { color: '#f97316', rgb: '249, 115, 22', title: en ? 'Payment not completed' : 'Betaling niet gelukt', body: en ? 'Go back to your other tab to try again.' : 'Ga terug naar je andere tabblad om het opnieuw te proberen.' };
          var el = function(tag, css, text) { var n = document.createElement(tag); n.style.cssText = css; if (text) n.textContent = text; return n; };
          var screen = el('div', 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#0a0510');
          var card = el('div', 'max-width:28rem;padding:2rem;text-align:center;border-radius:0.5rem;background:rgba(2,0,3,0.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(' + result.rgb + ',0.3);box-shadow:0 6px 30px rgba(0,0,0,0.7),inset 0 0 12px rgba(' + result.rgb + ',0.06)');
          card.appendChild(el('h1', "margin:0 0 1rem;color:" + result.color + ";font-family:'Lexend Mega',Arial,Helvetica,sans-serif;font-weight:bold;text-transform:uppercase;letter-spacing:0.15em;font-size:max(13px,0.7vw);text-shadow:0 0 10px rgba(" + result.rgb + ",0.3)", result.title));
          card.appendChild(el('p', "margin:0 0 1.25rem;color:#FFFEF0;font-family:'Figtree',sans-serif;font-size:max(12px,0.65vw);line-height:1.65", result.body));
          var note = el('p', "margin:0;color:rgba(255,254,240,0.5);font-family:'Figtree',sans-serif;font-size:max(10px,0.5vw)", en ? 'This window closes by itself.' : 'Dit venster sluit vanzelf.');
          card.appendChild(note);
          screen.appendChild(card);
          document.body.appendChild(screen);
          setTimeout(function() { try { window.close(); } catch (e) {} }, 1500);
          setTimeout(function() { note.textContent = en ? 'You can close this window now.' : 'Je kunt dit venster nu sluiten.'; }, 3000);
          return;
        }

        // ── Mobile: React owns the entire experience (MobileApp) ──
        // Remove the overlay outright rather than fading it, so the spinner never
        // flashes on a surface that is not going to use it.
        if (isMobile) {
          var overlay = document.getElementById('gfl-loading-overlay');
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
          return;
        }

        // ── Desktop: the loading screen is already painted; wait for React ──
        // Safety net: if React never signals ready (crash / aborted effect), force-dismiss
        // after 30 seconds so the user isn't stuck forever. 30s > the app's own 20s
        // anti-hang cap, so this only fires on a real crash.
        setTimeout(function() {
          if (!appReady) {
            console.warn('[GFL] App never signaled ready — forcing overlay dismiss');
            window.__gflDismissOverlay();
          }
        }, 30000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
