<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0510">
    <meta name="msapplication-navbutton-color" content="#0a0510">
    <meta name="color-scheme" content="dark">
    <title>Garden For Life - DELTAWERKEN</title>
    <!-- Google Fonts - Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }

        /* Desktop: prevent scroll (map uses transforms) */
        @media (min-width: 768px) {
            html, body, #root {
                overflow: hidden !important;
            }
        }

        /* Mobile: allow vertical scroll */
        @media (max-width: 767px) {
            html, body {
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            #root {
                overflow: visible !important;
                min-height: 100%;
                height: auto;
            }
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0a0510;
            color: #e0e0e0;
        }

        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Loading overlay — rendered BEFORE any JS so it appears instantly -->
    <div id="gfl-loading-overlay" style="
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 99999;
      background-color: rgba(0, 0, 0, 0.98);
      opacity: 1;
      transition: opacity 0.5s ease-out;
    ">
      <div style="
        position: relative;
        background-color: rgba(8, 2, 12, 0.9);
        padding: 2.5rem 3rem;
        min-width: 380px;
        max-width: 500px;
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 0.5rem;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex; flex-direction: column; align-items: center;
      " id="gfl-loading-modal">
        <!-- Corner accents -->
        <div style="position:absolute;top:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:10px 0 0 0;border-bottom:none;border-right:none"></div>
        <div style="position:absolute;top:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 10px 0 0;border-bottom:none;border-left:none"></div>
        <div style="position:absolute;bottom:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 0 10px;border-top:none;border-right:none"></div>
        <div style="position:absolute;bottom:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 10px 0;border-top:none;border-left:none"></div>

        <!-- Content wrapper (counter-rotated on mobile) -->
        <div id="gfl-loading-content" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%">
          <!-- Phase 1: Passkey input (shown FIRST — preloading runs in background) -->
          <div id="gfl-passkey-phase" style="width:100%;text-align:center;">
            <p style="color:#a855f7;font-family:'Lexend Mega',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;margin:0 0 6px">Beta Access</p>
            <p style="color:#666;font-size:11px;margin:0 0 16px;font-family:'Figtree',sans-serif">Voer je passkey in om verder te gaan</p>
            <input
              id="gfl-passkey-input"
              type="text"
              placeholder="Passkey..."
              autocomplete="off"
              style="
                width:100%;padding:10px 14px;border-radius:8px;
                background:rgba(255,255,255,0.06);border:1px solid rgba(168,85,247,0.3);
                color:#fff;font-size:14px;font-family:'Figtree',sans-serif;
                outline:none;box-sizing:border-box;margin-bottom:10px;
                transition:border-color 0.2s;
              "
            />
            <p id="gfl-passkey-error" style="color:#f87171;font-size:11px;margin:0 0 10px;display:none"></p>
            <button
              id="gfl-passkey-btn"
              style="
                width:100%;padding:10px 0;border-radius:8px;
                background:linear-gradient(135deg,#a855f7,#7c3aed);
                color:#fff;border:none;font-size:13px;font-weight:600;
                cursor:pointer;font-family:'Figtree',sans-serif;
                letter-spacing:0.05em;transition:opacity 0.2s;
              "
            >Unlock</button>
          </div>

          <!-- Phase 2: Spinner + slideshow (shown after passkey accepted, while app loads) -->
          <div id="gfl-loading-phase2" style="display:none;width:100%;display:none;flex-direction:column;align-items:center">
            <!-- Spinner -->
            <div id="gfl-loading-spinner" class="keep-spinning" style="
              width: 3rem; height: 3rem;
              border: 2px solid #a855f7;
              border-top-color: transparent;
              border-radius: 50%;
              margin: 0 auto 1.5rem;
            "></div>

            <!-- Rotating text slideshow -->
            <div id="gfl-loading-slideshow" style="
              position: relative;
              width: 100%;
              max-width: 380px;
              min-height: 3.6rem;
              overflow: hidden;
            ">
              <p class="gfl-slide keep-spinning" style="animation-delay: 0s">Omgeving initialiseren</p>
              <p class="gfl-slide keep-spinning" style="animation-delay: 2.8s">Exclusieve toegang<br>tot Beta V4.9</p>
              <p class="gfl-slide keep-spinning" style="animation-delay: 5.6s">Six Seven</p>
            </div>
          </div>
        </div>

        <!-- Noise overlay -->
        <div style="position:absolute;inset:0;pointer-events:none;border-radius:0.5rem;background-image:url('https://grainy-gradients.vercel.app/noise.svg');opacity:0.05;mix-blend-mode:overlay"></div>
      </div>
    </div>

    <!-- Loading animations — pure CSS, runs on compositor thread -->
    <style>
      @keyframes gfl-spin { to { transform: rotate(360deg); } }
      #gfl-loading-spinner { animation: gfl-spin 1s linear infinite; }

      /* Text slideshow: 3 cards, 8.4s total cycle, each visible 2.8s */
      @keyframes gfl-slide-cycle {
        0%      { opacity: 0; transform: translateY(6px); }
        3%      { opacity: 1; transform: translateY(0); }
        30%     { opacity: 1; transform: translateY(0); }
        35%     { opacity: 0; transform: translateY(-6px); }
        100%    { opacity: 0; transform: translateY(-6px); }
      }
      .gfl-slide {
        position: absolute;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        letter-spacing: 0.05em;
        color: rgba(255, 254, 240, 0.9);
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        line-height: 1.4;
        opacity: 0;
        animation: gfl-slide-cycle 8.4s ease-in-out infinite;
      }
      /* Post-login Levensles — static (no rotation), wraps a full paragraph. */
      .gfl-lesson-label {
        margin: 0 0 0.9rem;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        font-family: 'Rajdhani', sans-serif;
        font-size: 0.72rem;
        color: #c4b5fd;
      }
      .gfl-lesson-slide {
        margin: 0;
        text-align: center;
        letter-spacing: 0.02em;
        color: rgba(255, 254, 240, 0.9);
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        animation: gfl-fade-in 0.6s ease-out both;
      }
      @keyframes gfl-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      #gfl-passkey-input:focus {
        border-color: #a855f7 !important;
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
      }
      #gfl-passkey-btn:hover { opacity: 0.9; }
      #gfl-passkey-btn:active { opacity: 0.7; }

      @media (max-width: 767px) {
        #gfl-loading-modal { padding: 1.5rem 1.25rem !important; min-width: auto !important; width: 85vw !important; max-width: 85vw !important; box-sizing: border-box !important; }
        #gfl-loading-spinner { width: 2.5rem !important; height: 2.5rem !important; }
        .gfl-slide { font-size: 0.9rem !important; word-wrap: break-word !important; overflow-wrap: break-word !important; white-space: normal !important; }
        #gfl-loading-slideshow { min-height: 3.2rem !important; max-width: 100% !important; overflow: hidden !important; }
        #gfl-passkey-input { font-size: 16px !important; }
      }
    </style>

    <!-- Gate logic — passkey first, then loading spinner if app isn't ready yet -->
    <script>
      (function() {
        // Fade out & remove the overlay — defined first so all branches can call it
        window.__gflDismissOverlay = function() {
          var overlay = document.getElementById('gfl-loading-overlay');
          if (!overlay) return;
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          setTimeout(function() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 500);
        };

        var BETA_KEY = 'gfl_beta_access';
        var BETA_KEY_TIME = 'gfl_beta_access_time';
        var BETA_SESSION_MS = 24 * 60 * 60 * 1000; // 24 hours
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var isMobile = window.innerWidth < 768;
        var appReady = false;

        // Check passkey + 24h expiry
        var unlocked = (function() {
          var key = localStorage.getItem(BETA_KEY);
          if (!key) return false;
          var t = parseInt(localStorage.getItem(BETA_KEY_TIME) || '0', 10);
          if (!t || (Date.now() - t) > BETA_SESSION_MS) {
            localStorage.removeItem(BETA_KEY);
            localStorage.removeItem(BETA_KEY_TIME);
            return false;
          }
          return true;
        })();

        // Called by React when preloading + nebula are done
        window.__gflAppReady = function() {
          appReady = true;
          // If already unlocked (returning user or localhost auto-skip), dismiss now
          if (unlocked) {
            window.__gflDismissOverlay();
          }
        };

        // Post-login boot: the login flow stashes the client's archetype "Levensles" in
        // localStorage before hard-refreshing. If present, show it in the loading slideshow
        // (replacing the generic rotating slides) for this one boot, then clear it.
        (function applyBootLesson() {
          var lesson = null;
          try { lesson = localStorage.getItem('gfl_boot_lesson'); } catch (e) {}
          if (!lesson) return;
          try { localStorage.removeItem('gfl_boot_lesson'); } catch (e) {}
          var ss = document.getElementById('gfl-loading-slideshow');
          if (!ss) return;
          ss.style.minHeight = 'auto';
          ss.style.overflow = 'visible';
          ss.style.maxWidth = '440px';
          var label = document.createElement('p');
          label.className = 'gfl-lesson-label';
          label.textContent = 'Levensles';
          var body = document.createElement('p');
          body.className = 'gfl-lesson-slide';
          body.textContent = lesson;           // textContent — safe, no HTML injection
          ss.innerHTML = '';
          ss.appendChild(label);
          ss.appendChild(body);
        })();

        // After passkey accepted (or auto-skip): show spinner or dismiss
        function onUnlocked() {
          unlocked = true;
          if (appReady) {
            // App already loaded while user was typing — dismiss immediately
            window.__gflDismissOverlay();
          } else {
            // App still loading — switch to spinner
            var pk = document.getElementById('gfl-passkey-phase');
            var p2 = document.getElementById('gfl-loading-phase2');
            if (pk) pk.style.display = 'none';
            if (p2) { p2.style.display = 'flex'; }
            // Safety net: if React never signals ready (crash / aborted effect),
            // force-dismiss the overlay after 30 seconds so user isn't stuck forever.
            // (30s > the app's own 20s anti-hang cap, so this only fires on a real crash.)
            setTimeout(function() {
              if (!appReady) {
                console.warn('[GFL] App never signaled ready — forcing overlay dismiss');
                window.__gflDismissOverlay();
              }
            }, 30000);
          }
        }

        // ── Mobile: React owns the entire experience ──
        // Immediately hide the HTML passkey input and dismiss the overlay.
        // AdminMobilePortal in React handles passkey entry and auth.
        if (isMobile) {
          var pkPhase = document.getElementById('gfl-passkey-phase');
          if (pkPhase) pkPhase.style.display = 'none';
          window.__gflDismissOverlay();
        }

        // ── Desktop: full gated preloading flow ──
        if (!isMobile && unlocked) {
          // Skip passkey, show spinner immediately
          var pk = document.getElementById('gfl-passkey-phase');
          var p2 = document.getElementById('gfl-loading-phase2');
          if (pk) pk.style.display = 'none';
          if (p2) { p2.style.display = 'flex'; }
          // Safety net for returning users: same 30s crash-only force-dismiss
          setTimeout(function() {
            if (!appReady) {
              console.warn('[GFL] App never signaled ready (returning user) — forcing dismiss');
              window.__gflDismissOverlay();
            }
          }, 30000);
        }

        // ── Passkey input (both mobile fresh + desktop fresh) ──
        if (!unlocked) {
          var input = document.getElementById('gfl-passkey-input');
          var btn = document.getElementById('gfl-passkey-btn');
          var err = document.getElementById('gfl-passkey-error');
          if (input) input.focus();

          function verify() {
            var key = (input && input.value || '').trim();
            if (!key) return;
            btn.textContent = '...';
            btn.disabled = true;
            if (err) err.style.display = 'none';

            var apiBase = isLocal
              ? 'http://localhost:8080/api'
              : 'https://gfl-api.onrender.com/api';

            // 12-second timeout — Render free tier needs ~10s cold-start
            var fetchAbort = new AbortController();
            var fetchTimer = setTimeout(function() { fetchAbort.abort(); }, 12000);

            // Show "server wacht" hint after 4s if still pending
            var hintTimer = setTimeout(function() {
              if (btn.disabled) {
                btn.textContent = 'Server wacht...';
              }
            }, 4000);

            fetch(apiBase + '/beta/verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ passkey: key }),
              signal: fetchAbort.signal,
            })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                clearTimeout(fetchTimer); clearTimeout(hintTimer);
                if (data.valid) {
                  localStorage.setItem(BETA_KEY, key);
                  localStorage.setItem(BETA_KEY_TIME, Date.now().toString());
                  // Admin passkey: flag for stripped mobile admin portal
                  if (data.adminMode) {
                    localStorage.setItem('gfl_admin_mode', '1');
                    if (data.token) localStorage.setItem('gfl_token', data.token);
                  } else {
                    localStorage.removeItem('gfl_admin_mode');
                  }
                  // Mobile admin: dismiss immediately (no preload needed)
                  if (isMobile && data.adminMode) {
                    window.__gflDismissOverlay();
                  } else {
                    onUnlocked();
                  }
                } else {
                  if (err) { err.textContent = 'Ongeldige passkey'; err.style.display = 'block'; }
                  btn.textContent = 'Unlock';
                  btn.disabled = false;
                  if (input) { input.value = ''; input.focus(); }
                }
              })
              .catch(function(e) {
                clearTimeout(fetchTimer); clearTimeout(hintTimer);
                var msg = (e && e.name === 'AbortError')
                  ? 'Server start op — probeer opnieuw'
                  : 'Verbindingsfout — probeer opnieuw';
                if (err) { err.textContent = msg; err.style.display = 'block'; }
                btn.textContent = 'Unlock';
                btn.disabled = false;
              });
          }

          if (btn) btn.addEventListener('click', verify);
          if (input) input.addEventListener('keydown', function(e) { if (e.key === 'Enter') verify(); });
        }

      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
