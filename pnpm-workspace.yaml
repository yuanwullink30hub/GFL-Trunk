packages:
  - 'apps/*'
  - 'packages/*'
  # platform-legacy is a throwaway CRA reference snapshot (deleted in Phase 9);
  # not a workspace member — avoids installing react-scripts under pnpm.
  - '!apps/platform-legacy'
  # The desktop app is deliberately NOT a workspace member: its devDependencies pull
  # Electron (~200MB) plus electron-builder, which every Cloudflare and Render install
  # would otherwise download for a build that never touches it. It bundles the platform
  # UI as built output (scripts/sync-ui.js), so it needs no workspace links either.
  # Install it on its own:  cd apps/desktop && pnpm install
  - '!apps/desktop'
