<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0510">
    <meta name="msapplication-navbutton-color" content="#0a0510">
    <meta name="color-scheme" content="dark">
    <title>Garden For Life - DELTAWERKEN</title>
    <!-- Google Fonts - Rajdhani -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent;
        }

        /* Desktop: prevent scroll (map uses transforms) */
        @media (min-width: 768px) {
            html, body, #root {
                overflow: hidden !important;
            }
        }

        /* Mobile: allow vertical scroll */
        @media (max-width: 767px) {
            html, body {
                overflow-y: auto !important;
                overflow-x: hidden !important;
            }
            #root {
                overflow: visible !important;
                min-height: 100%;
                height: auto;
            }
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0a0510;
            color: #e0e0e0;
        }

        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Loading overlay — rendered BEFORE any JS so it appears instantly -->
    <div id="gfl-loading-overlay" style="
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 99999;
      background-color: rgba(0, 0, 0, 0.98);
      opacity: 1;
      transition: opacity 0.5s ease-out;
    ">
      <div style="
        position: relative;
        background-color: rgba(8, 2, 12, 0.9);
        padding: 2.5rem 3rem;
        min-width: 380px;
        max-width: 500px;
        border: 1px solid rgba(147, 51, 234, 0.3);
        border-radius: 0.5rem;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex; flex-direction: column; align-items: center;
      " id="gfl-loading-modal">
        <!-- Corner accents -->
        <div style="position:absolute;top:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:10px 0 0 0;border-bottom:none;border-right:none"></div>
        <div style="position:absolute;top:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 10px 0 0;border-bottom:none;border-left:none"></div>
        <div style="position:absolute;bottom:-1px;left:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 0 10px;border-top:none;border-right:none"></div>
        <div style="position:absolute;bottom:-1px;right:-1px;width:1.25rem;height:1.25rem;border:1.5px solid #a855f7;border-radius:0 0 10px 0;border-top:none;border-left:none"></div>

        <!-- Spinner -->
        <div id="gfl-loading-spinner" style="
          width: 3rem; height: 3rem;
          border: 2px solid #a855f7;
          border-top-color: transparent;
          border-radius: 50%;
          margin-bottom: 1.5rem;
        "></div>

        <!-- Rotating text slideshow (pure CSS — won't freeze during shader compile) -->
        <div id="gfl-loading-slideshow" style="
          position: relative;
          width: 100%;
          max-width: 380px;
          min-height: 3.6rem;
          overflow: hidden;
        ">
          <p class="gfl-slide" style="animation-delay: 0s">Verbinding vaststellen</p>
          <p class="gfl-slide" style="animation-delay: 2.8s">Exclusieve toegang tot Versie Beta2.9</p>
          <p class="gfl-slide" style="animation-delay: 5.6s">Six Seven</p>
        </div>

        <!-- Noise overlay -->
        <div style="position:absolute;inset:0;pointer-events:none;border-radius:0.5rem;background-image:url('https://grainy-gradients.vercel.app/noise.svg');opacity:0.05;mix-blend-mode:overlay"></div>
      </div>
    </div>

    <!-- Loading animations — pure CSS, runs on compositor thread -->
    <style>
      @keyframes gfl-spin { to { transform: rotate(360deg); } }
      #gfl-loading-spinner { animation: gfl-spin 1s linear infinite; }

      /* Text slideshow: 3 cards, 8.4s total cycle, each visible 2.8s */
      @keyframes gfl-slide-cycle {
        0%      { opacity: 0; transform: translateY(6px); }
        3%      { opacity: 1; transform: translateY(0); }
        30%     { opacity: 1; transform: translateY(0); }
        35%     { opacity: 0; transform: translateY(-6px); }
        100%    { opacity: 0; transform: translateY(-6px); }
      }
      .gfl-slide {
        position: absolute;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        letter-spacing: 0.05em;
        color: rgba(255, 254, 240, 0.9);
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        line-height: 1.4;
        opacity: 0;
        animation: gfl-slide-cycle 8.4s ease-in-out infinite;
      }

      @media (max-width: 767px) {
        #gfl-loading-modal { padding: 2rem 1.5rem !important; min-width: auto !important; max-width: 90vw !important; }
        #gfl-loading-spinner { width: 2.5rem !important; height: 2.5rem !important; }
        .gfl-slide { font-size: 0.9rem !important; }
        #gfl-loading-slideshow { min-height: 3.2rem !important; }
      }
    </style>

    <div id="root"></div>
</body>
</html>
